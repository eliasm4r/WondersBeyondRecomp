name: Linux

on:
  push:
    branches: [main, ports]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools and the SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev
      - name: Configure
        run: cmake -S . -B build/out -G Ninja -DCMAKE_BUILD_TYPE=Release -DWP_REQUIRE_SDL3=ON
      - name: Build
        run: cmake --build build/out --target runtime_tests translator_tests
      - name: Test
        working-directory: build/out
        run: ctest --output-on-failure

  asm-fibers:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools and the SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev
      - name: Configure with the assembly fiber switch
        run: cmake -S . -B build/out -G Ninja -DCMAKE_BUILD_TYPE=Release -DWP_REQUIRE_SDL3=ON -DWP_ASM_FIBERS=ON
      - name: Build
        run: cmake --build build/out --target runtime_tests translator_tests
      - name: Test
        working-directory: build/out
        run: ctest --output-on-failure

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-numpy
      - name: Configure for Android
        run: cmake -S . -B build/android-${{ matrix.abi }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DWP_REQUIRE_SDL3=ON
      - name: Build
        run: cmake --build build/android-${{ matrix.abi }} --target runtime_tests translator_tests android_smoke -- -k 0
      - name: Package the smoke test app
        run: python3 tools/build_apk.py --target android_smoke --abi ${{ matrix.abi }} --ndk "$ANDROID_NDK_LATEST_HOME" --keystore build/test.keystore --output build/dist/smoke-${{ matrix.abi }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            build/dist/smoke-${{ matrix.abi }}.apk
            build/android-${{ matrix.abi }}/runtime_tests
            build/android-${{ matrix.abi }}/translator_tests
          retention-days: 7

  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-x86_64
          path: artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the tests and the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/emulator_test.sh artifact

  sdl3-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            machine: x86_64
          - runner: ubuntu-22.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev libpipewire-0.3-dev libibus-1.0-dev
      - name: Build SDL3 as a shared library on an older system
        run: |
          curl -fsSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
          echo "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68  sdl.tar.gz" | sha256sum -c
          tar -xzf sdl.tar.gz
          cmake -S SDL3-3.4.16 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl3" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build sdl-build
          cmake --install sdl-build
      - name: Make the Linux setup
        run: python3 tools/make_setup.py --linux sdl3 ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        with:
          name: setup-linux-${{ matrix.machine }}
          path: build/dist/WondersBeyondRecomp-Setup-Linux-${{ matrix.machine }}.zip
          retention-days: 14

  setup-linux:
    needs: sdl3-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup-linux-${{ matrix.machine }}
      - name: Run the setup steps that need no disc, with no compiler from the system
        run: |
          sudo apt-get remove -y --purge g++ gcc clang || true
          unzip -q WondersBeyondRecomp-Setup-Linux-${{ matrix.machine }}.zip
          cd WondersBeyondRecomp-Setup
          url=$(sed -n 's/^PYTHON_URL="\(.*\)"$/\1/p' Setup.sh | sed "s/\${PYTHON_ARCH}/${{ matrix.machine }}/")
          curl -fsSL -o python.tar.gz "$url"
          tar -xzf python.tar.gz
          python/bin/python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python/bin/python3 - <<'PY'
          import os, shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "installer")
          import steps, texts
          root = Path.home() / "WondersBeyondRecomp"
          install = steps.Install(root, "", Path(".").resolve(), True, texts.TEXTS, lambda kind, value: print(kind, value, flush=True))
          install.python = str(Path("python/bin/python3").resolve())
          install.log = sys.stdout
          move = lambda part: None
          install.copy_sources(move)
          for tool in steps.TOOLS:
              install.download(tool, move)
              install.unpack(tool)
          print(install.program("cmake"), install.program("ninja"), install.program("nodtool"))
          install.run([install.program("nodtool"), "--version"])
          install.configure(move)
          install.run([install.program("cmake"), "--build", "build/out", "--parallel", str(steps.compile_jobs()), "--target", "runtime_tests"])
          install.run([str(root / "build" / "out" / "runtime_tests")])
          shutil.copyfile(root / "build" / "out" / "runtime_tests", root / "build" / "out" / steps.EXECUTABLE)
          install.finish(move)
          print(sorted(path.name for path in root.iterdir()))
          print((Path.home() / ".local/share/applications" / (steps.APP_IDENTIFIER + ".desktop")).read_text())
          PY
