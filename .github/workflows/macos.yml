name: macOS

on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja and NumPy
        run: |
          brew install ninja
          python -m pip install numpy
      - name: Configure
        run: cmake -S . -B build/out -G Ninja -DCMAKE_BUILD_TYPE=Release -DWP_REQUIRE_SDL3=ON
      - name: Build
        run: cmake --build build/out --target runtime_tests translator_tests
      - name: Test
        working-directory: build/out
        run: ctest --output-on-failure
